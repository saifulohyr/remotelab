# SIMLab Agent Configuration
agent:
  version: "1.0.0"
  telemetry_interval: 15   # interval laporan telemetri & polling perintah (detik)
  log_level: "info"

# Jalur Online Cloud (Internet / Cloudflare Tunnel)
server:
  url: "https://simlab.labmuma.xyz"
  token: "CHANGE_ME"  # Set locally from a private secret store; never commit credentials.

# Jalur MQTT (Direct LAN Lokal)
mqtt:
  broker_host: "192.168.1.2"
  broker_port: 1883
  username: "agent-lab1-pc01"
  password: "CHANGE_ME"  # Set locally from a private secret store; never commit credentials.
  use_tls: false
  ca_cert_path: ""
  keep_alive: 10

# Identitas Workstation & Ruangan
lab:
  # Pilihan kode ruangan:
  # lab-rpl-1, lab-rpl-2, lab-rpl-3, lab-rpl-4, lab-bahasa, lab-rps
  # PENTING: gunakan kode di atas, bukan "lab1"/"pc01" dari config lama.
  lab_id: "lab-rpl-1"

  # Pembeda ID:
  # - PC Siswa : isi "auto" (otomatis baca nama komputer Windows)
  # - PC Guru  : isi "komguru" (otomatis didaftarkan sebagai Master Relay WoL)
  pc_id: "auto"
