# ============================================================================
# SIMLab Mosquitto Configuration
# ============================================================================

# ── Listeners ──────────────────────────────────────────────
# Plain TCP (development only — disable in production)
listener 1883 0.0.0.0
protocol mqtt

# TLS listener (production)
listener 8883 0.0.0.0
protocol mqtt
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# ── Authentication ─────────────────────────────────────────
# Password file (use mosquitto_passwd to manage)
password_file /etc/mosquitto/passwd

# Enable per-user ACL
acl_file /etc/mosquitto/acl.conf

# Deny anonymous access
allow_anonymous false

# ── Security ───────────────────────────────────────────────
# Use username as client ID enforcement is handled by ACL
# max_connections 500
max_inflight_messages 20
max_queued_messages 1000

# ── Persistence ────────────────────────────────────────────
persistence true
persistence_location /var/lib/mosquitto/
persistence_file mosquitto.db
autosave_interval 300

# ── Logging ────────────────────────────────────────────────
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Limits ─────────────────────────────────────────────────
# Max message size 1KB (telemetry payloads are small)
message_size_limit 1024

# Keep-alive range
max_keepalive 120
