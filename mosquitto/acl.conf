# ============================================================================
# SIMLab Mosquitto ACL Configuration
# ============================================================================
#
# Format:
#   user <username>
#   topic [read|write|readwrite|deny] <topic pattern>
#
# Pattern substitutions:
#   %u = username
#   %c = client ID
#
# ============================================================================

# ── Worker (full access to all simlab topics) ──────────────
user simlab-worker
topic readwrite simlab/#

# ── Server/Laravel (publish commands, read all) ────────────
user simlab-server
topic readwrite simlab/#

# ── Per-agent ACL (pattern-based) ──────────────────────────
# Agent usernames follow the pattern: agent-{lab_id}-{pc_id}
# Each agent can only publish/subscribe to its own topics.
#
# NOTE: Mosquitto's pattern ACL uses %u (username), so agent
# usernames must match their topic path segments.
#
# Example: username = agent-lab1-pc01
# This allows access to simlab/lab1/pc01/*

# Agent/relay ACLs must be generated per identity. Mosquitto patterns cannot
# extract lab/PC segments from usernames, so wildcard pattern rules here would
# allow cross-lab spoofing. Intentionally no generic agent/relay grant.
#
# Example (generate equivalent entries for every provisioned identity):
# user agent-lab1-pc01
# topic write simlab/lab1/pc01/telemetry
# topic write simlab/lab1/pc01/status
# topic write simlab/lab1/pc01/ack
# topic read simlab/lab1/pc01/command
#
# user relay-lab1
# topic write simlab/lab1/relay/status
# topic write simlab/lab1/relay/ack
# topic read simlab/lab1/relay/wake

# ── Deny all other access by default ──────────────────────
# (Handled by allow_anonymous false + password file)
