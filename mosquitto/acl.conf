# ============================================================================
# SIMLab Mosquitto ACL Configuration
# ============================================================================
#
# Format:
#   user <username>
#   topic [read|write|readwrite|deny] <topic pattern>
#
# Pattern substitutions:
#   %u = username
#   %c = client ID
#
# ============================================================================

# ── Worker (full access to all simlab topics) ──────────────
user simlab-worker
topic readwrite simlab/#

# ── Server/Laravel (publish commands, read all) ────────────
user simlab-server
topic readwrite simlab/#

# ── Per-agent ACL (pattern-based) ──────────────────────────
# Agent usernames follow the pattern: agent-{lab_id}-{pc_id}
# Each agent can only publish/subscribe to its own topics.
#
# NOTE: Mosquitto's pattern ACL uses %u (username), so agent
# usernames must match their topic path segments.
#
# Example: username = agent-lab1-pc01
# This allows access to simlab/lab1/pc01/*

# Pattern-based ACL for agents
# Agents publish telemetry (QoS 0)
pattern readwrite simlab/+/+/telemetry
pattern readwrite simlab/+/+/status
pattern readwrite simlab/+/+/ack
pattern read simlab/+/+/command
pattern read simlab/+/all/command

# ── Per-relay ACL ──────────────────────────────────────────
# Relay usernames follow: relay-{lab_id}
# Example: username = relay-lab1

pattern readwrite simlab/+/relay/status
pattern readwrite simlab/+/relay/ack
pattern read simlab/+/relay/wake

# ── Deny all other access by default ──────────────────────
# (Handled by allow_anonymous false + password file)
