# SIMLab MQTT Worker Configuration
mqtt:
  broker_host: "192.168.1.100"
  broker_port: 8883
  username: "simlab-worker"
  password: "CHANGE_ME"  # Set locally from a private secret store; never commit credentials.
  use_tls: true
  ca_cert_path: ""

database:
  host: "127.0.0.1"
  port: 3306
  name: "simlab"
  username: "simlab"
  password: "CHANGE_ME"  # Set locally from a private secret store; never commit credentials.

worker:
  batch_size: 100            # max rows per batch insert
  flush_interval: 2000       # ms between flushes
  offline_threshold: 45      # seconds before marking PC offline

laravel:
  base_url: "http://127.0.0.1:8000"
  api_token: "CHANGE_ME"  # Set locally from a private secret store; never commit credentials.
